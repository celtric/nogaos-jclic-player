# Every push and pull request builds the player. A tag v<version> (matching the POM version) also publishes the jar
# and its sources to this repository's GitHub Packages Maven repository, which the NoGaOS build consumes.
name: Build

on:
  push:
    branches: [nogaos]
    tags: ['v*']
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          # Writes a settings.xml whose "github" server (the POM's distributionManagement id) authenticates with
          # GITHUB_ACTOR / GITHUB_TOKEN from the environment
          server-id: github
      - name: Build
        run: ./mvnw -B --no-transfer-progress verify
      - name: Check the tag names the POM version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pom_version=$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout)
          test "v${pom_version}" = "${GITHUB_REF_NAME}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match POM version ${pom_version}"
            exit 1
          }
      - name: Publish to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./mvnw -B --no-transfer-progress deploy -DskipTests
