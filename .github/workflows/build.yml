# Every push and pull request builds the player and the bundle. A tag v<version> (matching the POM version) also
# publishes the artifacts to this repository's GitHub Packages Maven repository and creates a GitHub release whose
# assets are the bundle NoGaOS downloads at first use, the sources jars and the licence.
name: Build

on:
  push:
    branches: [nogaos]
    tags: ['v*']
  pull_request:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          # Writes a settings.xml whose "github" server (the POM's distributionManagement id) authenticates with
          # GITHUB_ACTOR / GITHUB_TOKEN from the environment
          server-id: github
      - name: Build
        run: ./mvnw -B --no-transfer-progress verify
      - name: Check the tag names the POM version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pom_version=$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout)
          test "v${pom_version}" = "${GITHUB_REF_NAME}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match POM version ${pom_version}"
            exit 1
          }
      - name: Publish to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./mvnw -B --no-transfer-progress deploy -DskipTests
      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The bundle's SHA-256 goes into the notes: the NoGaOS app pins it and refuses any other download.
        run: |
          version="${GITHUB_REF_NAME#v}"
          bundle="embedded/target/nogaos-jclic-embedded-${version}.jar"
          test -f "$bundle"
          sha=$(sha256sum "$bundle" | cut -d' ' -f1)
          echo "$sha  $(basename "$bundle")" > "embedded/target/nogaos-jclic-embedded-${version}.jar.sha256"
          {
            echo "JClic player ${version}, built from the unmodified upstream source tree in this repository (GPL-2.0-or-later)."
            echo
            echo "\`nogaos-jclic-embedded-${version}.jar\` is the bundle the NoGaOS JClic app downloads at first use; its SHA-256 is \`${sha}\`. The sources jars and \`LICENSE\` are the corresponding source."
          } > /tmp/release-notes.md
          gh release create "$GITHUB_REF_NAME" --title "JClic player ${version}" --notes-file /tmp/release-notes.md \
            "$bundle" "embedded/target/nogaos-jclic-embedded-${version}.jar.sha256" \
            embedded/target/nogaos-jclic-embedded-${version}-sources.jar \
            player/target/nogaos-jclic-player-${version}-sources.jar LICENSE
